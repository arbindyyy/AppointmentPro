services:
  - type: web
    name: appointment-booking-app
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run dev
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: appointment-db
          property: connectionString

databases:
  - name: appointment-db
    databaseName: appointment_db
    plan: free